<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Inify</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/favicon.ico">
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Medium.ttf') format('truetype');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue: #2E5A8B;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
            --text-muted: rgba(248, 248, 248, 0.6);
        }

        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, var(--midnight) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 16px;
        }

        .back-home {
            position: fixed;
            top: 30px;
            right: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--cyan);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 80px;
            width: auto;
        }

        .auth-header h1 {
            color: var(--pearl);
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .auth-card {
            background: rgba(30, 58, 95, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(107, 184, 201, 0.15);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: var(--pearl);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid rgba(107, 184, 201, 0.2);
            border-radius: 14px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(107, 184, 201, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(248, 248, 248, 0.4);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--cyan);
        }

        .forgot-link {
            color: var(--cyan);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--cyan-light);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--blue-mid) 0%, var(--cyan) 100%);
            color: var(--midnight);
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(107, 184, 201, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(107, 184, 201, 0.2);
        }

        .divider span {
            padding: 0 20px;
        }

        .social-login {
            display: flex;
            gap: 14px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            background: rgba(10, 22, 40, 0.5);
            border: 1px solid rgba(107, 184, 201, 0.15);
            border-radius: 12px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: var(--cyan);
            background: rgba(107, 184, 201, 0.1);
        }

        .google-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .auth-footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            color: var(--cyan-light);
        }

        .error-message {
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ff8080;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .verification-notice {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .verification-notice.show {
            display: block;
        }

        .resend-btn {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            margin-top: 12px;
            transition: all 0.3s;
        }

        .resend-btn:hover {
            background: rgba(255, 193, 7, 0.3);
        }

        .resend-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 24px;
            }
            
            .auth-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        الرئيسية
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <img src="/static/images/inify-icon.png" alt="Inify" style="height: 100px;">
            </div>
            <h1>مرحباً بعودتك</h1>
            <p>سجل دخولك للوصول إلى لوحة التحكم</p>
        </div>

        <div class="auth-card">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="verification-notice" id="verificationNotice">
                <div>⚠️ يرجى تفعيل حسابك عبر الرابط المرسل إلى بريدك الإلكتروني</div>
                <button type="button" class="resend-btn" id="resendBtn" onclick="resendVerification()">
                    إعادة إرسال رابط التفعيل
                </button>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        تذكرني
                    </label>
                    <a href="/auth/forgot-password/" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="submit-btn">تسجيل الدخول</button>
            </form>

            <!-- Google Sign-In -->
            <div class="divider">
                <span>أو</span>
            </div>
            
            <div style="display: flex; justify-content: center; margin-bottom: 16px;">
                <a href="/accounts/google/login/?next=/dashboard/" class="social-btn google-btn" style="
                    width: 100%;
                    max-width: 350px;
                    padding: 14px 24px;
                    text-decoration: none;
                ">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    تسجيل الدخول بـ Google
                </a>
            </div>
        </div>

        <div class="auth-footer">
            ليس لديك حساب؟ <a href="/register">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        let currentEmail = '';
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const email = form.querySelector('input[name="email"]').value;
            const password = form.querySelector('input[name="password"]').value;
            const errorDiv = document.getElementById('errorMessage');
            const verificationDiv = document.getElementById('verificationNotice');
            
            // Hide previous messages
            errorDiv.classList.remove('show');
            verificationDiv.classList.remove('show');
            
            currentEmail = email;
            
            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch('/auth/login/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/dashboard/';
                } else if (data.email_not_verified) {
                    // Show verification notice
                    verificationDiv.classList.add('show');
                } else {
                    errorDiv.textContent = data.error || 'بيانات الدخول غير صحيحة';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'حدث خطأ في الاتصال';
                errorDiv.classList.add('show');
            }
        });

        async function resendVerification() {
            const btn = document.getElementById('resendBtn');
            const verificationDiv = document.getElementById('verificationNotice');
            
            if (!currentEmail) {
                alert('يرجى إدخال البريد الإلكتروني أولاً');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            
            try {
                const formData = new FormData();
                formData.append('email', currentEmail);
                
                const response = await fetch('/auth/resend-verification/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    verificationDiv.innerHTML = '<div style="color: #4ade80;">✅ ' + data.message + '</div>';
                } else {
                    alert(data.error || 'فشل إرسال الرابط');
                    btn.disabled = false;
                    btn.textContent = 'إعادة إرسال رابط التفعيل';
                }
            } catch (error) {
                alert('حدث خطأ في الاتصال');
                btn.disabled = false;
                btn.textContent = 'إعادة إرسال رابط التفعيل';
            }
        }
    </script>
    
    <!-- Theme Toggle Script -->
    <script src="/static/js/theme.js"></script>
</body>
</html>
