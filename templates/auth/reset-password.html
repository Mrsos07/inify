<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - Inify</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #0A1628 0%, #1E3A5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo img { height: 60px; }
        h1 { color: #1E3A5F; text-align: center; margin-bottom: 10px; font-size: 26px; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #4A90A4; }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2E5A8B, #4A90A4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(74,144,164,0.4); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .error-page { text-align: center; }
        .error-page .icon { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        {% if error %}
            <div class="error-page">
                <div class="icon">❌</div>
                <h1>رابط غير صالح</h1>
                <p class="subtitle">{{ error }}</p>
                <a href="/auth/forgot-password/" class="btn" style="display: inline-block; text-decoration: none; margin-top: 20px;">طلب رابط جديد</a>
            </div>
        {% else %}
            <div class="logo">
                <img src="/static/images/inify-icon.png" alt="Inify">
            </div>
            <h1>🔑 إعادة تعيين كلمة المرور</h1>
            <p class="subtitle">أدخل كلمة المرور الجديدة</p>
            
            <div id="message" class="message" style="display: none;"></div>
            
            <form id="resetForm">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" name="password" required minlength="8" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" name="confirm_password" required minlength="8" placeholder="••••••••">
                </div>
                <button type="submit" class="btn" id="submitBtn">تغيير كلمة المرور</button>
            </form>
        {% endif %}
    </div>
    
    <script>
        const form = document.getElementById('resetForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const msg = document.getElementById('message');
                const password = e.target.password.value;
                const confirmPassword = e.target.confirm_password.value;
                const token = e.target.token.value;
                
                if (password !== confirmPassword) {
                    msg.className = 'message error';
                    msg.textContent = 'كلمتا المرور غير متطابقتين';
                    msg.style.display = 'block';
                    return;
                }
                
                if (password.length < 8) {
                    msg.className = 'message error';
                    msg.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
                    msg.style.display = 'block';
                    return;
                }
                
                btn.disabled = true;
                btn.textContent = 'جاري التغيير...';
                
                try {
                    const formData = new FormData();
                    formData.append('token', token);
                    formData.append('password', password);
                    
                    const response = await fetch('/auth/reset-password/', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    msg.className = 'message ' + (data.success ? 'success' : 'error');
                    msg.textContent = data.message || data.error;
                    msg.style.display = 'block';
                    
                    if (data.success) {
                        setTimeout(() => {
                            window.location.href = '/auth/login/';
                        }, 2000);
                    }
                } catch (error) {
                    msg.className = 'message error';
                    msg.textContent = 'حدث خطأ. حاول مرة أخرى.';
                    msg.style.display = 'block';
                }
                
                btn.disabled = false;
                btn.textContent = 'تغيير كلمة المرور';
            });
        }
    </script>
    
    <!-- Theme Toggle Script -->
    <script src="/static/js/theme.js"></script>
</body>
</html>
