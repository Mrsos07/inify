<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب - Inify</title>
    <link rel="icon" type="image/png" href="/static/images/inify-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(160deg, #0A1628 0%, #1E3A5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        .success .icon { color: #22c55e; }
        .error .icon { color: #ef4444; }
        h1 { color: #1E3A5F; margin-bottom: 15px; font-size: 28px; }
        p { color: #666; line-height: 1.8; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #2E5A8B, #4A90A4);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container {% if success %}success{% else %}error{% endif %}">
        {% if success %}
            <div class="icon">✅</div>
            <h1>تم تفعيل حسابك!</h1>
            <p>مرحباً بك في Inify. حسابك الآن مفعّل ويمكنك البدء في استخدام المنصة.</p>
            <a href="/dashboard/" class="btn">الذهاب للوحة التحكم</a>
        {% else %}
            <div class="icon">❌</div>
            <h1>خطأ في التفعيل</h1>
            <p>{{ error }}</p>
            <a href="/auth/login/" class="btn">تسجيل الدخول</a>
        {% endif %}
    </div>
</body>
</html>
