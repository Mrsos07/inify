<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Newra</title>
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Medium.ttf') format('truetype');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue: #2E5A8B;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
            --text-muted: rgba(248, 248, 248, 0.6);
        }

        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, var(--midnight) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .back-home {
            position: fixed;
            top: 30px;
            right: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--cyan);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, var(--pearl) 0%, #e0f0f5 100%);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 50px rgba(107, 184, 201, 0.2);
        }

        .logo svg {
            width: 50px;
            height: 50px;
        }

        .auth-header h1 {
            color: var(--pearl);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .auth-card {
            background: rgba(30, 58, 95, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid rgba(107, 184, 201, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--pearl);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid rgba(107, 184, 201, 0.2);
            border-radius: 12px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(107, 184, 201, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(248, 248, 248, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--blue-mid) 0%, var(--cyan) 100%);
            color: var(--midnight);
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(107, 184, 201, 0.3);
        }

        .terms {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .terms a {
            color: var(--cyan);
            text-decoration: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .auth-footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            color: var(--cyan-light);
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        الرئيسية
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <svg viewBox="0 0 239.1 237.16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#0A1628" d="M49.8.17l139.61-.17c25.85,4.23,45.81,25.31,48.59,51.41-2.5,42.88,3.38,89.6.05,132.02-2.09,26.7-23.15,48.7-49.54,52.46-44.11-2.96-93.49,4-136.98,0-29.29-2.7-48.76-28.22-50.56-56.44-2.75-43.14,1.14-90.47,1.3-133.78C7.1,22.19,25.98,3.8,49.8.17ZM171.67,113.54c19.93-19.93,12.03-54.15-14.37-63.42-31.71-11.13-63.23,20.16-49.47,51.47,1.34,3.05,5.95,7.42,4.72,10.26l-20.53,26.56c-9.39-.24-15.92-1.95-24.33,3.66-17.3,11.53-13.65,38.58,6.11,44.55,23.76,7.19,41.48-18.58,28.37-39.08l20.85-27.19c2.25-1.44,5.99,1.91,8.44,2.6,14.25,4.01,29.51,1.29,40.2-9.41Z"/>
                </svg>
            </div>
            <h1>إنشاء حساب جديد</h1>
            <p>ابدأ رحلتك مع Newra اليوم</p>
        </div>

        <div class="auth-card">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>الاسم الأول</label>
                        <input type="text" name="first_name" placeholder="الاسم الأول" required>
                    </div>
                    <div class="form-group">
                        <label>الاسم الأخير</label>
                        <input type="text" name="last_name" placeholder="الاسم الأخير" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" placeholder="05xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" name="password2" placeholder="أعد إدخال كلمة المرور" required>
                </div>

                <button type="submit" class="submit-btn">إنشاء الحساب</button>

                <p class="terms">
                    بإنشاء حساب، أنت توافق على <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const password = form.querySelector('input[name="password"]').value;
            const password2 = form.querySelector('input[name="password2"]');
            
            if (password2 && password !== password2.value) {
                alert('كلمات المرور غير متطابقة');
                return;
            }
            
            try {
                const formData = new FormData(form);
                
                const response = await fetch('/auth/register/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/dashboard/';
                } else {
                    alert(data.error || 'حدث خطأ في التسجيل');
                }
            } catch (error) {
                alert('حدث خطأ في الاتصال');
            }
        });
    </script>
</body>
</html>
