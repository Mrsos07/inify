<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Inify</title>
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Medium.ttf') format('truetype');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue: #2E5A8B;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
            --text-muted: rgba(248, 248, 248, 0.6);
        }

        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, var(--midnight) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 16px;
        }

        .back-home {
            position: fixed;
            top: 30px;
            right: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--cyan);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 80px;
            width: auto;
        }

        .auth-header h1 {
            color: var(--pearl);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .auth-card {
            background: rgba(30, 58, 95, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid rgba(107, 184, 201, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--pearl);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid rgba(107, 184, 201, 0.2);
            border-radius: 12px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(107, 184, 201, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(248, 248, 248, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--blue-mid) 0%, var(--cyan) 100%);
            color: var(--midnight);
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(107, 184, 201, 0.3);
        }

        .terms {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .terms a {
            color: var(--cyan);
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(107, 184, 201, 0.2);
        }

        .divider span {
            padding: 0 15px;
        }

        .social-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(107, 184, 201, 0.2);
            border-radius: 12px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: var(--cyan);
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .auth-footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            color: var(--cyan-light);
        }

        .success-message {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.4);
            color: #4ade80;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .success-message h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .success-message p {
            font-size: 14px;
            opacity: 0.9;
        }

        .success-message .redirect-text {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        الرئيسية
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <img src="/static/images/inify-icon.png" alt="Inify" style="height: 100px;">
            </div>
            <h1>إنشاء حساب جديد</h1>
            <p>ابدأ رحلتك مع Inify اليوم</p>
        </div>

        <div class="auth-card">
            <div class="success-message" id="successMessage">
                <h3>✅ تم إنشاء الحساب بنجاح!</h3>
                <p id="successText">تحقق من بريدك الإلكتروني لتفعيل الحساب</p>
                <div class="redirect-text">جاري التحويل لصفحة تسجيل الدخول...</div>
            </div>
            
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>الاسم الأول</label>
                        <input type="text" name="first_name" placeholder="الاسم الأول" required>
                    </div>
                    <div class="form-group">
                        <label>الاسم الأخير</label>
                        <input type="text" name="last_name" placeholder="الاسم الأخير" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" name="phone" placeholder="05xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" name="password2" placeholder="أعد إدخال كلمة المرور" required>
                </div>

                <button type="submit" class="submit-btn">إنشاء الحساب</button>

                <!-- Google Sign-Up -->
                <div class="divider">
                    <span>أو</span>
                </div>

                <a href="/accounts/google/login/?next=/dashboard/" class="social-btn" style="text-decoration: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    التسجيل بـ Google
                </a>

                <p class="terms">
                    بإنشاء حساب، أنت توافق على <a href="/terms/" target="_blank">شروط الاستخدام</a> و <a href="/privacy/" target="_blank">سياسة الخصوصية</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const password = form.querySelector('input[name="password"]').value;
            const password2 = form.querySelector('input[name="password2"]');
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            
            if (password2 && password !== password2.value) {
                alert('كلمات المرور غير متطابقة');
                return;
            }
            
            try {
                const formData = new FormData(form);
                
                const response = await fetch('/auth/register/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.require_verification) {
                        // Hide form and show success message
                        form.style.display = 'none';
                        successText.textContent = data.message || 'تحقق من بريدك الإلكتروني لتفعيل الحساب';
                        successDiv.classList.add('show');
                        
                        // Redirect after 3 seconds
                        setTimeout(() => {
                            window.location.href = '/auth/login/';
                        }, 3000);
                    } else {
                        window.location.href = '/dashboard/';
                    }
                } else {
                    alert(data.error || 'حدث خطأ في التسجيل');
                }
            } catch (error) {
                alert('حدث خطأ في الاتصال');
            }
        });
    </script>
    
    <!-- Theme Toggle Script -->
    <script src="/static/js/theme.js"></script>
</body>
</html>
