<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - Inify</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/css/theme.css">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #0A1628 0%, #1E3A5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo img { height: 60px; }
        h1 { color: #1E3A5F; text-align: center; margin-bottom: 10px; font-size: 26px; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #4A90A4; }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2E5A8B, #4A90A4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(74,144,164,0.4); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #4A90A4; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/images/inify-icon.png" alt="Inify">
        </div>
        <h1>🔐 نسيت كلمة المرور؟</h1>
        <p class="subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط استعادة كلمة المرور</p>
        
        <div id="message" class="message"></div>
        
        <form id="forgotForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" required placeholder="example@email.com">
            </div>
            <button type="submit" class="btn" id="submitBtn">إرسال رابط الاستعادة</button>
        </form>
        
        <div class="back-link">
            <a href="/auth/login/">← العودة لتسجيل الدخول</a>
        </div>
    </div>
    
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            const email = e.target.email.value;
            
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            
            try {
                const formData = new FormData();
                formData.append('email', email);
                
                const response = await fetch('/auth/forgot-password/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                msg.className = 'message ' + (data.success ? 'success' : 'error');
                msg.textContent = data.message || data.error;
                msg.style.display = 'block';
                
                if (data.success) {
                    e.target.reset();
                }
            } catch (error) {
                msg.className = 'message error';
                msg.textContent = 'حدث خطأ. حاول مرة أخرى.';
                msg.style.display = 'block';
            }
            
            btn.disabled = false;
            btn.textContent = 'إرسال رابط الاستعادة';
        });
    </script>
    
    <!-- Theme Toggle Script -->
    <script src="/static/js/theme.js"></script>
</body>
</html>
