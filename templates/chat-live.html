<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة الشات - Inify</title>
    
    <!-- 🔒 Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/images/inify-icon.png">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
            --text-muted: rgba(248, 248, 248, 0.6);
            --border: rgba(107, 184, 201, 0.15);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'BalooBhaijaan2', sans-serif;
            background: linear-gradient(135deg, #0A1628 0%, #1E3A5F 50%, #0A1628 100%);
            color: var(--pearl);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header */
        .page-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--pearl);
        }

        .page-title span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(107, 184, 201, 0.15);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--pearl);
            text-decoration: none;
            font-family: inherit;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(107, 184, 201, 0.25);
            border-color: var(--cyan);
        }

        /* Chat Container - Embed Style */
        #chatContainer {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 120px);
            max-height: 700px;
            background: var(--midnight);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
        }

        /* Header */
        .chat-header {
            padding: 16px 24px;
            background: rgba(30, 58, 95, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .agent-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
        }

        .agent-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .agent-info h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .agent-info span {
            font-size: 13px;
            color: var(--cyan-light);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: rgba(30, 58, 95, 0.6);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-right-radius: 6px;
        }

        .message.user {
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            color: var(--midnight);
            align-self: flex-end;
            border-bottom-left-radius: 6px;
        }

        .message.typing {
            display: flex;
            gap: 6px;
            padding: 18px 22px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Property Cards */
        .properties-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .property-card {
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .property-image {
            height: 160px;
            background: var(--dark-blue);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .property-image::after {
            content: '🔍 اضغط لعرض الصورة';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            font-size: 12px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .property-image:hover::after {
            opacity: 1;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .property-image:hover img {
            transform: scale(1.05);
        }

        .property-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--cyan), var(--blue-mid));
            color: var(--midnight);
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .property-content {
            padding: 16px;
        }

        .property-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .property-location {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .property-details {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--cyan-light);
        }

        .property-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 12px;
        }

        /* Input */
        .chat-input-container {
            padding: 20px 24px;
            background: rgba(30, 58, 95, 0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(10, 22, 40, 0.8);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            transition: border-color 0.3s;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--cyan);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--pearl);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            padding: 4px 0;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(107, 184, 201, 0.3);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--midnight);
        }

        /* Test Mode Badge */
        .test-badge {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .gallery-modal.show {
            display: flex;
        }

        .gallery-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .gallery-image {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-nav:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-nav.prev { right: 20px; }
        .gallery-nav.next { left: 20px; }

        .gallery-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .gallery-property-info {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
        }

        .gallery-property-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .gallery-property-info p {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Page Header -->
    <div class="page-header">
        <div class="page-title">
            <h1>🤖 تجربة الشات</h1>
            <span class="test-badge">وضع التجربة</span>
        </div>
        <a href="/dashboard/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            العودة للوحة التحكم
        </a>
    </div>

    <div id="chatContainer">
        <!-- Will be populated by JavaScript -->
    </div>

    <!-- Gallery Modal -->
    <div class="gallery-modal" id="galleryModal" onclick="closeGalleryOnBackdrop(event)">
        <button class="gallery-close" onclick="closeGallery()">×</button>
        <button class="gallery-nav prev" onclick="prevImage()">❮</button>
        <img class="gallery-image" id="galleryImage" src="" alt="">
        <button class="gallery-nav next" onclick="nextImage()">❯</button>
        <div class="gallery-property-info" id="galleryPropertyInfo"></div>
        <div class="gallery-counter" id="galleryCounter"></div>
    </div>

    <script src="/config.js"></script>
    <script>
        // Get agent ID from Django context
        const agentId = '{{ agent_id|default:"demo" }}';
        const agentName = '{{ agent_name|default:"Inify" }}';
        
        // Global settings from database
        let globalAdminSettings = null;
        
        // Load global settings from database
        async function loadGlobalSettings() {
            try {
                const response = await fetch('/api/settings/');
                const data = await response.json();
                if (data.success && data.settings) {
                    globalAdminSettings = data.settings;
                    console.log('✅ Global settings loaded from database');
                }
            } catch (error) {
                console.error('Error loading global settings:', error);
            }
        }
        
        let agentSettings = null;
        let properties = [];
        let conversationHistory = [];
        let lastSearchedProperties = [];
        let currentGalleryImages = [];
        let currentGalleryIndex = 0;

        // Initialize
        async function init() {
            const container = document.getElementById('chatContainer');
            
            if (!agentId || agentId === 'demo') {
                showError('لم يتم تحديد الوكيل', 'يرجى إنشاء حساب وتسجيل الدخول أولاً');
                return;
            }
            
            // Load global settings from database first
            await loadGlobalSettings();
            
            // Load agent settings and properties
            const loaded = await loadAgentData(agentId);
            
            if (!loaded) {
                showError('خطأ في التحميل', 'لم يتم العثور على بيانات الوكيل');
                return;
            }
            
            // Render chat interface
            renderChat();
        }

        // Load agent data from API
        async function loadAgentData(id) {
            try {
                const response = await fetch(`/api/v1/properties/agent/${id}/`);
                const data = await response.json();
                
                if (!data.success) {
                    console.error('Agent not found:', data.error);
                    return false;
                }
                
                // Load agent settings from API response
                if (data.agent) {
                    agentSettings = {
                        agentName: data.agent.name || agentName || 'Inify',
                        agentDescription: data.agent.title || 'وكيل عقاري ذكي',
                        personality: data.agent.personality || '',
                        company: data.agent.company || '',
                        city: data.agent.city || '',
                        phone: data.agent.phone || '',
                        email: data.agent.email || '',
                        welcomeMessage: data.agent.welcomeMessage || 'مرحباً! 👋 هذا وضع التجربة. كيف يمكنني مساعدتك؟',
                        agentIcon: '🤖',
                        systemPrompt: data.agent.systemPrompt || '',
                        collectLeads: false, // Disabled in test mode
                        language: data.agent.language || 'ar',
                        enableRAG: true,
                        ragResults: '5'
                    };
                } else {
                    agentSettings = {
                        agentName: agentName || 'Inify',
                        agentDescription: 'وكيل عقاري ذكي',
                        welcomeMessage: 'مرحباً! 👋 هذا وضع التجربة. كيف يمكنني مساعدتك؟',
                        agentIcon: '🤖',
                        collectLeads: false,
                        enableRAG: true
                    };
                }
                
                // Load properties
                properties = data.properties.filter(p => !p.status || p.status === 'for_sale' || p.status === 'for_rent');
                console.log('✅ Properties loaded:', properties.length);
                console.log('✅ Agent loaded:', agentSettings.agentName);
                
                return true;
            } catch (error) {
                console.error('Error loading agent data:', error);
                return false;
            }
        }

        // Show error state
        function showError(title, message) {
            document.getElementById('chatContainer').innerHTML = `
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center;">
                    <div style="font-size: 64px; margin-bottom: 20px;">😕</div>
                    <h2 style="font-size: 24px; margin-bottom: 12px;">${title}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">${message}</p>
                    <a href="/dashboard/" style="padding: 12px 24px; background: linear-gradient(135deg, var(--blue-mid), var(--cyan)); color: var(--midnight); text-decoration: none; border-radius: 12px; font-weight: 600;">العودة للوحة التحكم</a>
                </div>
            `;
        }

        // Render chat interface
        function renderChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="chat-header">
                    <div class="agent-avatar">🤖</div>
                    <div class="agent-info">
                        <h1>${agentSettings.agentName}</h1>
                        <span><span class="status-dot"></span> وضع التجربة</span>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">${agentSettings.welcomeMessage}</div>
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
                        <button class="send-btn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            // Add welcome message to history
            conversationHistory.push({
                role: 'assistant',
                content: agentSettings.welcomeMessage
            });
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            input.value = '';
            
            // Add user message
            addMessage(message, 'user');
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            showTyping();
            
            try {
                const response = await getAIResponse(message);
                hideTyping();
                addMessage(response, 'bot');
                conversationHistory.push({ role: 'assistant', content: response });
                
                // Show property cards if mentioned
                const mentionedProperties = findMentionedProperties(response);
                if (mentionedProperties.length > 0) {
                    lastSearchedProperties = mentionedProperties;
                    const propertyCards = generatePropertyCards();
                    if (propertyCards) {
                        addMessage(propertyCards, 'bot', true);
                    }
                }
            } catch (error) {
                hideTyping();
                addMessage('عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.', 'bot');
            }
        }

        // Find mentioned properties in response
        function findMentionedProperties(response) {
            if (!properties || properties.length === 0) return [];
            
            const responseLower = response.toLowerCase();
            const presentationKeywords = ['لدي', 'عندي', 'عندنا', 'متوفر', 'موجود', 'لقيت', 'وجدت', 'شقة', 'فيلا', 'خيارات', 'عروض'];
            const hasPresentationKeyword = presentationKeywords.some(kw => responseLower.includes(kw));
            
            if (!hasPresentationKeyword) return [];
            
            const foundProperties = [];
            
            for (const prop of properties) {
                const districtMatch = prop.district && responseLower.includes(prop.district.toLowerCase());
                const priceMatch = prop.price && (
                    response.includes(prop.price.toString()) || 
                    response.includes(formatPrice(prop.price))
                );
                const areaMatch = prop.area && response.includes(prop.area.toString());
                const refMatch = prop.reference_number && response.includes(prop.reference_number);
                
                if (districtMatch || priceMatch || areaMatch || refMatch) {
                    foundProperties.push(prop);
                }
            }
            
            return foundProperties;
        }

        // Add message to chat
        function addMessage(content, type, isHtml = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (isHtml) {
                messageDiv.innerHTML = content;
            } else {
                messageDiv.textContent = content;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Show typing indicator
        function showTyping() {
            const messagesContainer = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Hide typing indicator
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // Get AI response - using Backend API
        async function getAIResponse(userMessage) {
            try {
                console.log('🔒 Sending request to secure Backend API...');
                
                const response = await fetch(`/api/v1/chat/embed/${agentId}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userMessage,
                        history: conversationHistory.slice(-6)
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    console.error('API Error:', data.error);
                    return 'عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.';
                }
                
                return data.response || 'عذراً، لم أتمكن من معالجة طلبك.';
            } catch (error) {
                console.error('Fetch Error:', error);
                return 'عذراً، حدث خطأ في الاتصال. يرجى التحقق من اتصال الإنترنت.';
            }
        }

        // Generate property cards HTML
        function generatePropertyCards() {
            if (lastSearchedProperties.length === 0) return '';
            
            return `
                <div class="properties-container">
                    ${lastSearchedProperties.map((p, i) => `
                        <div class="property-card">
                            ${p.mainImage ? `
                                <div class="property-image" onclick="openGallery(${i})">
                                    <img src="${p.mainImage}" alt="${p.title}">
                                    <span class="property-badge">${p.listing_type === 'sale' ? 'للبيع' : 'للإيجار'}</span>
                                </div>
                            ` : ''}
                            <div class="property-content">
                                ${p.reference_number ? `<div style="font-size: 10px; color: var(--cyan); margin-bottom: 4px;">🔖 ${p.reference_number}</div>` : ''}
                                <div class="property-title">${p.title}</div>
                                <div class="property-location">📍 ${p.cityLabel || p.city}${p.district ? ' - ' + p.district : ''}</div>
                                <div class="property-details">
                                    ${p.area ? `<span>📐 ${p.area} م²</span>` : ''}
                                    ${p.bedrooms ? `<span>🛏️ ${p.bedrooms} غرف</span>` : ''}
                                    ${p.bathrooms ? `<span>🚿 ${p.bathrooms} حمام</span>` : ''}
                                </div>
                                <div class="property-price">
                                    ${formatPrice(p.price)} ريال${p.listing_type === 'rent' ? '/سنوي' : ''}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Format price
        function formatPrice(price) {
            if (!price) return '0';
            return parseInt(price).toLocaleString('ar-SA');
        }

        // Gallery functions
        let currentGalleryProperty = null;

        function openGallery(propertyIndex) {
            const property = lastSearchedProperties[propertyIndex];
            if (!property) return;
            
            currentGalleryProperty = property;
            currentGalleryImages = property.images && property.images.length > 0 
                ? property.images 
                : (property.mainImage ? [property.mainImage] : []);
            
            if (currentGalleryImages.length === 0) {
                alert('لا توجد صور لهذا العقار');
                return;
            }
            
            currentGalleryIndex = 0;
            
            const prevBtn = document.querySelector('.gallery-nav.prev');
            const nextBtn = document.querySelector('.gallery-nav.next');
            if (currentGalleryImages.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
            
            showGalleryImage();
            document.getElementById('galleryModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeGallery() {
            document.getElementById('galleryModal').classList.remove('show');
            document.body.style.overflow = '';
            currentGalleryProperty = null;
        }

        function closeGalleryOnBackdrop(event) {
            if (event.target.id === 'galleryModal') {
                closeGallery();
            }
        }

        function showGalleryImage() {
            const img = document.getElementById('galleryImage');
            img.src = currentGalleryImages[currentGalleryIndex];
            img.alt = currentGalleryProperty?.title || 'صورة العقار';
            
            document.getElementById('galleryCounter').textContent = 
                `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;
            
            if (currentGalleryProperty) {
                document.getElementById('galleryPropertyInfo').innerHTML = `
                    <h3>${currentGalleryProperty.title}</h3>
                    <p>${formatPrice(currentGalleryProperty.price)} ريال - ${currentGalleryProperty.cityLabel || currentGalleryProperty.city}</p>
                `;
            }
        }

        function nextImage() {
            currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
            showGalleryImage();
        }

        function prevImage() {
            currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            showGalleryImage();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('galleryModal').classList.contains('show')) return;
            
            if (e.key === 'Escape') closeGallery();
            if (e.key === 'ArrowLeft') nextImage();
            if (e.key === 'ArrowRight') prevImage();
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
