<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشات بوت - Inify</title>
    
    <!-- 🔒 Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <link rel="icon" type="image/png" href="/static/images/inify-icon.png">
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
            --text-muted: rgba(248, 248, 248, 0.6);
            --border: rgba(107, 184, 201, 0.15);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'BalooBhaijaan2', sans-serif;
            background: linear-gradient(135deg, #0A1628 0%, #1E3A5F 50%, #0A1628 100%);
            color: var(--pearl);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #chatContainer {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 40px);
            max-height: 700px;
            background: var(--midnight);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
        }

        /* Header */
        .chat-header {
            padding: 16px 24px;
            background: rgba(30, 58, 95, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .agent-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
        }

        .agent-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .agent-info h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .agent-info span {
            font-size: 13px;
            color: var(--cyan-light);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: rgba(30, 58, 95, 0.6);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-right-radius: 6px;
        }

        .message.user {
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            color: var(--midnight);
            align-self: flex-end;
            border-bottom-left-radius: 6px;
        }

        .message.typing {
            display: flex;
            gap: 6px;
            padding: 18px 22px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Property Cards */
        .properties-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .property-card {
            background: rgba(10, 22, 40, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .property-image {
            height: 160px;
            background: var(--dark-blue);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .property-image::after {
            content: '🔍 اضغط لعرض الصورة';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            font-size: 12px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .property-image:hover::after {
            opacity: 1;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .property-image:hover img {
            transform: scale(1.05);
        }

        .property-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--cyan), var(--blue-mid));
            color: var(--midnight);
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .property-content {
            padding: 16px;
        }

        .property-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .property-location {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .property-details {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--cyan-light);
        }

        .property-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--cyan);
            margin-top: 12px;
        }

        /* Input */
        .chat-input-container {
            padding: 20px 24px;
            background: rgba(30, 58, 95, 0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(10, 22, 40, 0.8);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            transition: border-color 0.3s;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--cyan);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--pearl);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            padding: 4px 0;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(107, 184, 201, 0.3);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--midnight);
        }

        /* Powered by */
        .powered-by {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            background: rgba(10, 22, 40, 0.4);
        }

        .powered-by a {
            color: var(--cyan);
            text-decoration: none;
        }

        /* Error state */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .error-message {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .gallery-modal.show {
            display: flex;
        }

        .gallery-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .gallery-image {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-nav:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-nav.prev { right: 20px; }
        .gallery-nav.next { left: 20px; }

        .gallery-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .gallery-property-info {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
        }

        .gallery-property-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .gallery-property-info p {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="chatContainer">
        <!-- Will be populated by JavaScript -->
    </div>

    <!-- Gallery Modal -->
    <div class="gallery-modal" id="galleryModal" onclick="closeGalleryOnBackdrop(event)">
        <button class="gallery-close" onclick="closeGallery()">×</button>
        <button class="gallery-nav prev" onclick="prevImage()">❮</button>
        <img class="gallery-image" id="galleryImage" src="" alt="">
        <button class="gallery-nav next" onclick="nextImage()">❯</button>
        <div class="gallery-property-info" id="galleryPropertyInfo"></div>
        <div class="gallery-counter" id="galleryCounter"></div>
    </div>

    <script src="/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        // Get agent ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const agentId = urlParams.get('agent');
        
        // 🔒 API Key is now handled securely on the backend - no exposure to frontend
        
        // Global settings from database
        let globalAdminSettings = null;
        
        // Load global settings from database
        async function loadGlobalSettings() {
            try {
                const response = await fetch('/api/settings/');
                const data = await response.json();
                if (data.success && data.settings) {
                    globalAdminSettings = data.settings;
                    console.log('✅ Global settings loaded from database');
                    console.log('📋 System Prompt:', globalAdminSettings.systemPrompt ? 'موجود ✅' : 'غير موجود ❌');
                }
            } catch (error) {
                console.error('Error loading global settings:', error);
            }
        }
        
        let agentSettings = null;
        let properties = [];
        let conversationHistory = [];
        let lastSearchedProperties = [];
        let currentGalleryImages = [];
        let currentGalleryIndex = 0;

        // Initialize
        async function init() {
            const container = document.getElementById('chatContainer');
            
            if (!agentId) {
                showError('لم يتم تحديد الوكيل', 'يرجى التأكد من صحة الرابط');
                return;
            }
            
            // Load global settings from database first
            await loadGlobalSettings();
            
            // Load agent settings and properties
            const loaded = await loadAgentData(agentId);
            
            if (!loaded) {
                showError('الوكيل غير موجود', 'لم يتم العثور على بيانات هذا الوكيل');
                return;
            }
            
            // Increment conversation counter
            incrementConversation();
            
            // Render chat interface
            renderChat();
        }
        
        // Increment conversation counter
        async function incrementConversation() {
            try {
                await fetch(`/api/agent/${agentId}/conversation/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                console.log('✅ Conversation counted');
            } catch (e) {
                console.log('Could not increment conversation');
            }
        }

        // Load agent data from API
        async function loadAgentData(id) {
            // Load properties and agent data from API
            try {
                const response = await fetch(`/api/v1/properties/agent/${id}/`);
                const data = await response.json();
                
                if (!data.success) {
                    console.error('Agent not found:', data.error);
                    return false;
                }
                
                // Load agent settings from API response
                if (data.agent) {
                    agentSettings = {
                        agentName: data.agent.name || 'Inify',
                        agentDescription: data.agent.title || 'وكيل عقاري ذكي',
                        personality: data.agent.personality || '',
                        company: data.agent.company || '',
                        city: data.agent.city || '',
                        phone: data.agent.phone || '',
                        email: data.agent.email || '',
                        welcomeMessage: data.agent.welcomeMessage || 'مرحباً! 👋 كيف يمكنني مساعدتك اليوم؟',
                        agentIcon: '🤖',
                        systemPrompt: data.agent.systemPrompt || '',
                        collectLeads: data.agent.collectLeads !== false,
                        language: data.agent.language || 'ar',
                        color: data.agent.color || '#000000',
                        enableRAG: true,
                        ragResults: '5'
                    };
                } else {
                    agentSettings = {
                        agentName: 'Inify',
                        agentDescription: 'وكيل عقاري ذكي',
                        personality: '',
                        company: '',
                        city: '',
                        phone: '',
                        email: '',
                        welcomeMessage: 'مرحباً! 👋 كيف يمكنني مساعدتك اليوم؟',
                        agentIcon: '🤖',
                        systemPrompt: '',
                        collectLeads: true,
                        language: 'ar',
                        color: '#000000',
                        enableRAG: true,
                        ragResults: '5'
                    };
                }
                
                // Load properties
                properties = data.properties.filter(p => !p.status || p.status === 'for_sale' || p.status === 'for_rent');
                console.log('✅ Properties loaded from API:', properties.length);
                console.log('✅ Agent loaded:', agentSettings.agentName);
                
            } catch (error) {
                console.error('Error loading agent data:', error);
                return false;
            }
            
            // Log properties
            console.log('═══════════════════════════════════════');
            console.log('🏠 Embed Chat - RAG System Initialized');
            console.log('📊 Properties loaded:', properties.length);
            if (properties.length > 0) {
                properties.forEach((p, i) => {
                    console.log(`   [${i+1}] ${p.title} - ${p.city} - ${p.price} ريال`);
                });
            }
            console.log('═══════════════════════════════════════');
            
            // Update page title
            document.title = `${agentSettings.agentName} - شات بوت`;
            
            return true;
        }

        // Get avatar content (image or emoji)
        function getAvatarContent() {
            if (agentSettings.useAvatarImage && agentSettings.agentAvatar) {
                return `<img src="${agentSettings.agentAvatar}" alt="${agentSettings.agentName}">`;
            }
            return agentSettings.agentIcon || '🤖';
        }

        // Show error state
        function showError(title, message) {
            document.getElementById('chatContainer').innerHTML = `
                <div class="error-container">
                    <div class="error-icon">😕</div>
                    <h2 class="error-title">${title}</h2>
                    <p class="error-message">${message}</p>
                </div>
            `;
        }

        // Render chat interface
        function renderChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="chat-header">
                    <div class="agent-avatar">${getAvatarContent()}</div>
                    <div class="agent-info">
                        <h1>${agentSettings.agentName}</h1>
                        <span><span class="status-dot"></span> متصل الآن</span>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">${agentSettings.welcomeMessage}</div>
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
                        <button class="send-btn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="powered-by">
                    مدعوم بواسطة <a href="/" target="_blank">Inify</a>
                </div>
            `;
            
            // Add welcome message to history
            conversationHistory.push({
                role: 'assistant',
                content: agentSettings.welcomeMessage
            });
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Track client info
        let clientInfo = {
            phone: null,
            name: null,
            savedToLeads: false
        };
        
        // ═══════════════════════════════════════════════════════════
        // 🛡️ Rate Limit & Abuse Detection System
        // ═══════════════════════════════════════════════════════════
        let abuseDetection = {
            offTopicCount: 0,           // عدد الأسئلة خارج الموضوع
            maxOffTopic: 7,             // الحد الأقصى
            isBlocked: false,           // هل تم حظر المستخدم
            suspiciousPatterns: [
                // محاولات كسر النموذج
                'ignore', 'تجاهل', 'انسى', 'forget',
                'system prompt', 'سيستم برومبت',
                'you are now', 'أنت الآن',
                'act as', 'تصرف ك',
                'pretend', 'تظاهر',
                'jailbreak', 'bypass',
                'ignore previous', 'تجاهل السابق',
                'new instructions', 'تعليمات جديدة',
                'override', 'تجاوز',
                'admin', 'أدمن', 'مشرف',
                'developer', 'مطور',
                'debug', 'test mode',
                'what is your prompt', 'ما هو البرومبت',
                'show me your instructions', 'أرني تعليماتك',
                'repeat after me', 'كرر ورائي',
                'say exactly', 'قل بالضبط'
            ],
            offTopicPatterns: [
                // أسئلة خارج العقارات
                'طبخ', 'وصفة', 'أكل',
                'سياسة', 'حرب', 'انتخابات',
                'دين', 'فتوى',
                'برمجة', 'كود', 'python', 'javascript',
                'قصة', 'حكاية', 'نكتة', 'ضحك',
                'أغنية', 'فيلم', 'مسلسل',
                'لعبة', 'game',
                'رياضة', 'كورة', 'مباراة',
                'طقس', 'جو',
                'ترجم', 'translate',
                'اكتب لي', 'write me',
                'ما رأيك في', 'what do you think'
            ]
        };
        
        // كشف الأسئلة المشبوهة
        function detectAbuse(message) {
            const msgLower = message.toLowerCase();
            
            // كشف محاولات كسر النموذج
            for (const pattern of abuseDetection.suspiciousPatterns) {
                if (msgLower.includes(pattern.toLowerCase())) {
                    console.log('🚨 Suspicious pattern detected:', pattern);
                    abuseDetection.isBlocked = true;
                    return 'blocked';
                }
            }
            
            // كشف الأسئلة خارج الموضوع
            for (const pattern of abuseDetection.offTopicPatterns) {
                if (msgLower.includes(pattern.toLowerCase())) {
                    abuseDetection.offTopicCount++;
                    console.log('⚠️ Off-topic question:', abuseDetection.offTopicCount, '/', abuseDetection.maxOffTopic);
                    
                    if (abuseDetection.offTopicCount >= abuseDetection.maxOffTopic) {
                        abuseDetection.isBlocked = true;
                        return 'blocked';
                    }
                    return 'off-topic';
                }
            }
            
            return 'ok';
        }
        
        // رسالة الحظر
        function getBlockedMessage() {
            return `عذراً، يبدو أن أسئلتك خارج نطاق خدماتنا العقارية 🏠

أنا هنا لمساعدتك في:
• البحث عن شقق وفلل
• معرفة الأسعار والمواصفات
• ترتيب مواعيد المعاينة

إذا كنت مهتماً بعقار، أخبرني! 😊`;
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            input.value = '';
            
            // ═══════════════════════════════════════════════════════════
            // 🛡️ فحص الإساءة قبل الإرسال
            // ═══════════════════════════════════════════════════════════
            if (abuseDetection.isBlocked) {
                addMessage(message, 'user');
                addMessage('عذراً، تم إيقاف المحادثة. يرجى التواصل معنا مباشرة للمساعدة. 📞', 'bot');
                // تعطيل حقل الإدخال
                document.getElementById('chatInput').disabled = true;
                document.getElementById('chatInput').placeholder = 'تم إيقاف المحادثة';
                return;
            }
            
            const abuseStatus = detectAbuse(message);
            if (abuseStatus === 'blocked') {
                addMessage(message, 'user');
                addMessage('🚫 تم إيقاف المحادثة بسبب أسئلة خارج نطاق الخدمة.\n\nللمساعدة في العقارات، يرجى التواصل معنا مباشرة. 📞', 'bot');
                // تعطيل حقل الإدخال
                document.getElementById('chatInput').disabled = true;
                document.getElementById('chatInput').placeholder = 'تم إيقاف المحادثة';
                return;
            }
            
            if (abuseStatus === 'off-topic') {
                addMessage(message, 'user');
                const remaining = abuseDetection.maxOffTopic - abuseDetection.offTopicCount;
                if (remaining <= 3) {
                    addMessage(`أنا متخصص في العقارات فقط 🏠\n\nكيف أقدر أساعدك في البحث عن شقة أو فيلا؟`, 'bot');
                } else {
                    addMessage(getBlockedMessage(), 'bot');
                }
                return;
            }
            // ═══════════════════════════════════════════════════════════
            
            // Check for phone number in message
            const phoneNumber = extractPhoneNumber(message);
            console.log('📱 Phone check:', phoneNumber, 'savedToLeads:', clientInfo.savedToLeads);
            if (phoneNumber && !clientInfo.savedToLeads) {
                clientInfo.phone = phoneNumber;
                console.log('📱 Saving lead with phone:', phoneNumber);
                // Save lead and redirect
                saveLeadAndRedirect();
            }
            
            // Add user message
            addMessage(message, 'user');
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            showTyping();
            
            try {
                const response = await getAIResponse(message);
                hideTyping();
                addMessage(response, 'bot');
                conversationHistory.push({ role: 'assistant', content: response });
                
                // عرض كروت العقارات إذا ذكر الوكيل عقارات
                const mentionedProperties = findMentionedProperties(response);
                if (mentionedProperties.length > 0) {
                    lastSearchedProperties = mentionedProperties;
                    const propertyCards = generatePropertyCards();
                    if (propertyCards) {
                        addMessage(propertyCards, 'bot', true);
                    }
                }
            } catch (error) {
                hideTyping();
                addMessage('عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.', 'bot');
            }
        }
        
        // البحث عن جميع العقارات المذكورة في رد الوكيل
        function findMentionedProperties(response) {
            if (!properties || properties.length === 0) return [];
            
            const responseLower = response.toLowerCase();
            
            // الكلمات التي تدل على عرض عقارات
            const presentationKeywords = ['لدي', 'عندي', 'عندنا', 'متوفر', 'موجود', 'لقيت', 'وجدت', 'شقة', 'فيلا', 'خيارات', 'عروض'];
            const hasPresentationKeyword = presentationKeywords.some(kw => responseLower.includes(kw));
            
            if (!hasPresentationKeyword) return [];
            
            const foundProperties = [];
            
            for (const prop of properties) {
                // البحث بالحي أو السعر أو المساحة أو الرقم المرجعي
                const districtMatch = prop.district && responseLower.includes(prop.district.toLowerCase());
                const priceMatch = prop.price && (
                    response.includes(prop.price.toString()) || 
                    response.includes(prop.price.toLocaleString('ar-SA')) ||
                    response.includes(formatPrice(prop.price))
                );
                const areaMatch = prop.area && response.includes(prop.area.toString());
                const refMatch = prop.reference_number && response.includes(prop.reference_number);
                
                // إذا ذكر الحي أو السعر أو المساحة أو الرقم المرجعي
                if (districtMatch || priceMatch || areaMatch || refMatch) {
                    console.log('🏠 Found mentioned property:', prop.title);
                    foundProperties.push(prop);
                }
            }
            
            return foundProperties;
        }

        // Extract phone number from message
        function extractPhoneNumber(text) {
            // Saudi phone patterns: 05xxxxxxxx, +966xxxxxxxx, 966xxxxxxxx
            const patterns = [
                /(?:\+?966|0)?5\d{8}/g,  // Saudi mobile
                /(?:\+?966|0)?1\d{7}/g,  // Saudi landline
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) {
                    let phone = match[0].replace(/\s/g, '');
                    // Normalize to 05xxxxxxxx format
                    if (phone.startsWith('+966')) {
                        phone = '0' + phone.slice(4);
                    } else if (phone.startsWith('966')) {
                        phone = '0' + phone.slice(3);
                    } else if (!phone.startsWith('0')) {
                        phone = '0' + phone;
                    }
                    return phone;
                }
            }
            return null;
        }

        // 🔒 XSS Protection - تنظيف النص
        function escapeHtml(text) {
            if (typeof text !== 'string') return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, char => map[char]);
        }

        // Analyze user query to extract requirements
        function analyzeUserQuery(query) {
            const q = query.toLowerCase();
            
            // Detect city
            const cities = {
                'الرياض': 'الرياض', 'رياض': 'الرياض',
                'جدة': 'جدة', 'جده': 'جدة',
                'مكة': 'مكة', 'مكه': 'مكة',
                'المدينة': 'المدينة', 'المدينه': 'المدينة',
                'الدمام': 'الدمام', 'دمام': 'الدمام',
                'الخبر': 'الخبر', 'خبر': 'الخبر',
                'الطائف': 'الطائف', 'طائف': 'الطائف',
                'تبوك': 'تبوك',
                'أبها': 'أبها', 'ابها': 'أبها'
            };
            for (const [key, value] of Object.entries(cities)) {
                if (q.includes(key)) {
                    clientRequirements.city = value;
                    break;
                }
            }
            
            // Detect listing type
            if (q.includes('ايجار') || q.includes('إيجار') || q.includes('اجار') || q.includes('استئجار') || q.includes('للايجار')) {
                clientRequirements.listingType = 'rent';
            } else if (q.includes('شراء') || q.includes('بيع') || q.includes('للبيع') || q.includes('اشتري')) {
                clientRequirements.listingType = 'sale';
            }
            
            // Detect property type
            const types = {
                'شقة': 'شقة', 'شقه': 'شقة', 'شقق': 'شقة',
                'فيلا': 'فيلا', 'فلة': 'فيلا', 'فلل': 'فيلا',
                'أرض': 'أرض', 'ارض': 'أرض', 'اراضي': 'أرض',
                'عمارة': 'عمارة', 'عماره': 'عمارة',
                'دور': 'دور', 'ادوار': 'دور',
                'مكتب': 'مكتب', 'مكاتب': 'مكتب',
                'محل': 'محل', 'محلات': 'محل'
            };
            for (const [key, value] of Object.entries(types)) {
                if (q.includes(key)) {
                    clientRequirements.type = value;
                    break;
                }
            }
            
            // Detect bedrooms
            const bedroomMatch = q.match(/(\d+)\s*(غرف|غرفة|غرف نوم)/);
            if (bedroomMatch) {
                clientRequirements.bedrooms = bedroomMatch[1];
            }
            
            // Check if all required info collected
            clientRequirements.collected = !!(clientRequirements.city && clientRequirements.listingType && clientRequirements.type);
        }

        // City name mapping (Arabic to English)
        const cityMapping = {
            'جدة': 'jeddah',
            'الرياض': 'riyadh',
            'الدمام': 'dammam',
            'مكة': 'makkah',
            'المدينة': 'madinah',

        // Search properties based on collected requirements
        function searchProperties(query) {
            console.log('🔍 Searching properties:', properties.length, 'total');
            console.log('📋 Client requirements:', clientRequirements);
            
            if (properties.length === 0) {
                console.log('⚠️ No properties loaded!');

            // If no requirements collected yet, return all properties
            if (!clientRequirements.city && !clientRequirements.listingType && !clientRequirements.type) {
                console.log('📋 No requirements yet, returning all properties');
                return properties.slice(0, 5);
            }
            
            // Use collected requirements for filtering
            let results = properties.filter(p => {
                let match = true;
                
                // Filter by city
                if (clientRequirements.city) {
                    const pCity = (p.cityLabel || p.city || '').toLowerCase();
                    const pDistrict = (p.district || '').toLowerCase();
                    const reqCity = clientRequirements.city.toLowerCase();
                    // Check direct match or mapped city
                    const mappedCity = cityMapping[clientRequirements.city] || reqCity;
                    // Match city OR district
                    const cityMatch = pCity.includes(reqCity) || pCity.includes(mappedCity) || pCity === mappedCity;
                    const districtMatch = pDistrict.includes(reqCity);
                    match = match && (cityMatch || districtMatch);
                }
                
                // Filter by listing type (rent/sale)
                if (clientRequirements.listingType) {
                    match = match && p.listing_type === clientRequirements.listingType;
                }
                
                // Filter by property type
                if (clientRequirements.type) {
                    const pType = (p.typeLabel || p.type || '').toLowerCase();
                    const reqType = clientRequirements.type.toLowerCase();
                    match = match && (pType.includes(reqType) || reqType.includes(pType));
                }
                
                // Filter by bedrooms if specified
                if (clientRequirements.bedrooms) {
                    match = match && p.bedrooms && parseInt(p.bedrooms) >= parseInt(clientRequirements.bedrooms);
                }
                
                console.log(`   Property "${p.title}": match=${match}`);
                return match;
            });
            
            console.log('✅ Found properties:', results.length);
            return results.slice(0, 5);
        }

                                <div class="property-location">📍 ${p.cityLabel || p.city}${p.district ? ' - ' + p.district : ''}</div>
                                <div class="property-details">
                                    ${p.area ? `<span>📐 ${p.area} م²</span>` : ''}
                                    ${p.bedrooms ? `<span>🛏️ ${p.bedrooms} غرف</span>` : ''}
                                    ${p.bathrooms ? `<span>🚿 ${p.bathrooms} حمام</span>` : ''}
                                </div>
                                <div class="property-price">
                                    ${formatPrice(p.price)} ريال${p.listing_type === 'rent' ? ({'yearly': '/سنوي', 'monthly': '/شهري', 'daily': '/يومي'}[p.rent_period || p.price_type] || '/سنوي') : ''}
                                </div>
                                <button onclick="selectProperty(${i})" style="
                                    width: 100%;
                                    margin-top: 10px;
                                    padding: 10px;
                                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                                    color: white;
                                    border: none;
                                    border-radius: 8px;
                                    font-family: inherit;
                                    font-size: 13px;
                                    font-weight: 600;
                                    cursor: pointer;
                                    transition: all 0.3s;
                                " onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                                    ❤️ مهتم بهذا العقار
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Format price
        function formatPrice(price) {
            if (!price) return '0';
            return parseInt(price).toLocaleString('ar-SA');
        }
        
        // اختيار عقار والرد على الوكيل
        function selectProperty(propertyIndex) {
            const property = lastSearchedProperties[propertyIndex];
            if (!property) return;
            
            // حفظ العقار المختار
            clientRequirements.selectedProperty = property;
            
            // إنشاء رسالة تلقائية
            const refNumber = property.reference_number ? ` (${property.reference_number})` : '';
            const message = `أنا مهتم بهذا العقار: ${property.title}${refNumber}`;
            
            // إرسال الرسالة تلقائياً
            document.getElementById('chatInput').value = message;
            sendMessage();
            
            console.log('✅ Property selected:', property.title, property.reference_number);
        }

        // Gallery functions
        let currentGalleryProperty = null;

        function openGallery(propertyIndex) {
            const property = lastSearchedProperties[propertyIndex];
            if (!property) return;
            
            currentGalleryProperty = property;
            currentGalleryImages = property.images && property.images.length > 0 
                ? property.images 
                : (property.mainImage ? [property.mainImage] : []);
            
            if (currentGalleryImages.length === 0) {
                alert('لا توجد صور لهذا العقار');
                return;
            }
            
            currentGalleryIndex = 0;
            
            // Show/hide navigation buttons based on image count
            const prevBtn = document.querySelector('.gallery-nav.prev');
            const nextBtn = document.querySelector('.gallery-nav.next');
            if (currentGalleryImages.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
            
            showGalleryImage();
            document.getElementById('galleryModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeGallery() {
            document.getElementById('galleryModal').classList.remove('show');
            document.body.style.overflow = '';
            currentGalleryProperty = null;
        }

        function closeGalleryOnBackdrop(event) {
            if (event.target.id === 'galleryModal') {
                closeGallery();
            }
        }

        function showGalleryImage() {
            const img = document.getElementById('galleryImage');
            img.src = currentGalleryImages[currentGalleryIndex];
            img.alt = currentGalleryProperty?.title || 'صورة العقار';
            
            // Update counter
            document.getElementById('galleryCounter').textContent = 
                `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;
            
            // Update property info
            if (currentGalleryProperty) {
                document.getElementById('galleryPropertyInfo').innerHTML = `
                    <h3>${currentGalleryProperty.title}</h3>
                    <p>${formatPrice(currentGalleryProperty.price)} ريال - ${currentGalleryProperty.cityLabel || currentGalleryProperty.city}</p>
                `;
            }
        }

        function nextImage() {
            currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
            showGalleryImage();
        }

        function prevImage() {
            currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            showGalleryImage();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('galleryModal').classList.contains('show')) return;
            
            if (e.key === 'Escape') closeGallery();
            if (e.key === 'ArrowLeft') nextImage();
            if (e.key === 'ArrowRight') prevImage();
        });

        // Swipe support for mobile
        let touchStartX = 0;
        document.getElementById('galleryModal').addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        document.getElementById('galleryModal').addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextImage();
                else prevImage();
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
