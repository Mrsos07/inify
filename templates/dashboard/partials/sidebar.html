<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">
            <!-- Newra Icon in Square Container (Brand Book 2.3-2.4) -->
            <svg viewBox="0 0 100 100" fill="none">
                <rect x="5" y="5" width="90" height="90" rx="20" fill="#181f29"/>
                <circle cx="38" cy="35" r="15" stroke="white" stroke-width="5" fill="none"/>
                <circle cx="38" cy="35" r="4" fill="white"/>
                <line x1="50" y1="47" x2="62" y2="62" stroke="white" stroke-width="5" stroke-linecap="round"/>
                <circle cx="67" cy="68" r="9" fill="white"/>
            </svg>
        </div>
        <span>newra</span>
    </div>

    <nav>
        <div class="nav-section">
            <div class="nav-section-title">القائمة الرئيسية</div>
            <a href="/dashboard/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
                لوحة التحكم
            </a>
            <a href="/dashboard/properties/" class="nav-item {% if active_page == 'properties' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                العقارات
            </a>
            <a href="/dashboard/leads/" class="nav-item {% if active_page == 'leads' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                </svg>
                العملاء
            </a>
            <a href="/dashboard/conversations/" class="nav-item {% if active_page == 'conversations' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                المحادثات
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">الإعدادات</div>
            <a href="/dashboard/bot-settings/" class="nav-item {% if active_page == 'bot_settings' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73v.27h1a7 7 0 0 1 7 7h.27c.34-.6.99-1 1.73-1a2 2 0 1 1 0 4c-.74 0-1.39-.4-1.73-1H20a7 7 0 0 1-7 7v.27c.6.34 1 .99 1 1.73a2 2 0 1 1-4 0c0-.74.4-1.39 1-1.73V20a7 7 0 0 1-7-7h-.27c-.34.6-.99 1-1.73 1a2 2 0 1 1 0-4c.74 0 1.39.4 1.73 1H4a7 7 0 0 1 7-7v-.27c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                إعدادات الوكيل
            </a>
            <a href="/dashboard/settings/" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                الإعدادات العامة
            </a>
            <a href="/auth/logout/" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                تسجيل الخروج
            </a>
        </div>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">{{ user_initials }}</div>
            <div class="user-details">
                <h4>{{ user_name }}</h4>
                <p>مسوق عقاري</p>
            </div>
        </div>
    </div>
</aside>
