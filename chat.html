<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثة - Newra</title>
    
    <style>
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'BalooBhaijaan2';
            src: url('/static/BalooBhaijaan2-Bold.ttf') format('truetype');
            font-weight: 700;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --midnight: #0A1628;
            --dark-blue: #1E3A5F;
            --blue-mid: #4A90A4;
            --cyan: #6BB8C9;
            --cyan-light: #8DD4E3;
            --pearl: #F8F8F8;
        }

        body {
            font-family: 'BalooBhaijaan2', 'Segoe UI', sans-serif;
            background: var(--midnight);
            color: var(--pearl);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(30, 58, 95, 0.5);
            border-bottom: 1px solid rgba(107, 184, 201, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-logo svg {
            width: 28px;
            height: 28px;
        }

        .chat-title h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .chat-title p {
            font-size: 13px;
            color: rgba(248, 248, 248, 0.6);
        }

        .back-btn {
            padding: 10px 20px;
            background: rgba(107, 184, 201, 0.15);
            border: 1px solid rgba(107, 184, 201, 0.3);
            border-radius: 10px;
            color: var(--pearl);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(107, 184, 201, 0.25);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 30px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.6;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(30, 58, 95, 0.6);
            border: 1px solid rgba(107, 184, 201, 0.15);
            border-top-right-radius: 6px;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            color: var(--midnight);
            border-top-left-radius: 6px;
        }

        .chat-input-container {
            padding: 20px 0;
            border-top: 1px solid rgba(107, 184, 201, 0.1);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(30, 58, 95, 0.4);
            border: 1px solid rgba(107, 184, 201, 0.2);
            border-radius: 16px;
            padding: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: var(--pearl);
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        .chat-input::placeholder {
            color: rgba(248, 248, 248, 0.4);
        }

        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
            border: none;
            border-radius: 12px;
            color: var(--midnight);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(107, 184, 201, 0.3);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 16px 20px;
            background: rgba(30, 58, 95, 0.6);
            border: 1px solid rgba(107, 184, 201, 0.15);
            border-radius: 20px;
            border-top-right-radius: 6px;
        }

        .typing-indicator.show {
            display: flex;
            gap: 6px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="chat-header">
        <div class="chat-header-left">
            <div class="chat-logo">
                <svg viewBox="0 0 239.1 237.16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#0A1628" d="M49.8.17l139.61-.17c25.85,4.23,45.81,25.31,48.59,51.41-2.5,42.88,3.38,89.6.05,132.02-2.09,26.7-23.15,48.7-49.54,52.46-44.11-2.96-93.49,4-136.98,0-29.29-2.7-48.76-28.22-50.56-56.44-2.75-43.14,1.14-90.47,1.3-133.78C7.1,22.19,25.98,3.8,49.8.17ZM171.67,113.54c19.93-19.93,12.03-54.15-14.37-63.42-31.71-11.13-63.23,20.16-49.47,51.47,1.34,3.05,5.95,7.42,4.72,10.26l-20.53,26.56c-9.39-.24-15.92-1.95-24.33,3.66-17.3,11.53-13.65,38.58,6.11,44.55,23.76,7.19,41.48-18.58,28.37-39.08l20.85-27.19c2.25-1.44,5.99,1.91,8.44,2.6,14.25,4.01,29.51,1.29,40.2-9.41Z"/>
                </svg>
            </div>
            <div class="chat-title">
                <h1>Newra AI</h1>
                <p>وكيلك العقاري الذكي</p>
            </div>
        </div>
        <a href="/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            الرئيسية
        </a>
    </header>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message bot">
                مرحباً بك! 👋 أنا Newra، وكيلك العقاري الذكي. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="chat-input-container">
            <form class="chat-input-wrapper" id="chatForm">
                <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button type="submit" class="send-btn">
                    إرسال
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const typingIndicator = document.getElementById('typingIndicator');

        const botResponses = [
            'يسعدني مساعدتك! ما نوع العقار الذي تبحث عنه؟',
            'لدينا العديد من الخيارات المميزة. هل تفضل شقة أم فيلا؟',
            'ما هي الميزانية التي تفضلها؟',
            'في أي منطقة تفضل السكن؟',
            'سأساعدك في إيجاد العقار المثالي. هل تريد حجز موعد معاينة؟',
            'ممتاز! سأرسل لك قائمة بالعقارات المتاحة.',
        ];

        let responseIndex = 0;

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message;
            messages.appendChild(userMsg);
            chatInput.value = '';

            // Show typing indicator
            typingIndicator.classList.add('show');
            messages.scrollTop = messages.scrollHeight;

            // Bot response after delay
            setTimeout(() => {
                typingIndicator.classList.remove('show');
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = botResponses[responseIndex % botResponses.length];
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
                responseIndex++;
            }, 1500);
        });
    </script>
</body>
</html>
