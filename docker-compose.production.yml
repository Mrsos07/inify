version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-evolution}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}  # From .env
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      # Server Configuration
      - SERVER_URL=${EVOLUTION_SERVER_URL}  # https://your-domain.com
      - SERVER_PORT=8080
      
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}  # From .env
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # Database
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}
      - DATABASE_CONNECTION_POOL_SIZE=15
      - DATABASE_CONNECTION_POOL_TIMEOUT=60000
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - LOG_COLOR=false
      - LOG_BAILEYS=false
      
      # Webhook Configuration
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=true
      
      # WhatsApp Configuration
      - CONFIG_SESSION_PHONE_CLIENT=Evolution
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1031615477
      
      # Connection Settings
      - CONNECTION_TIMEOUT=120000
      - QRCODE_LIMIT=60
      - QRCODE_COLOR=#198754
      - MOBILE_PAIRING_ENABLED=false
      
      # Performance & Stability
      - STORE_MESSAGES=false
      - STORE_MESSAGE_UP=false
      - STORE_CONTACTS=false
      - STORE_CHATS=false
      
      # Cache Configuration
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      
      # Instance Management
      - DEL_INSTANCE=false
      - DEL_TEMP_INSTANCES=false
      - PROVIDER_ENABLED=false
      
      # Security
      - CORS_ORIGIN=https://inify.ai,https://www.inify.ai
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      
    volumes:
      - evolution_data:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - evolution-network
    depends_on:
      - evolution-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  evolution_data:
    driver: local
  evolution_store:
    driver: local
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  evolution-network:
    driver: bridge
